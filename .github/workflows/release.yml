name: انتشار نسخهٔ ویندوز

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: نصب وابستگی‌ها
        run: npm ci
      - name: ساخت و انتشار نصب‌کننده
        run: npm run publish:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
