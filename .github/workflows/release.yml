name: انتشار نسخهٔ ویندوز

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: نصب وابستگی‌ها
        run: npm ci
      - name: ساخت نصب‌کننده
        run: npm run build:windows
      - name: انتشار نصب‌کننده و فایل‌های به‌روزرسانی
        uses: softprops/action-gh-release@v2
        with:
          name: مدیریت کارهای روزانه ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
